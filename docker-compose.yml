# Configuração comum às instâncias do backend (âncora YAML)
x-backend: &backend
  image: guess-game-backend:${BACKEND_VERSION:-1.0.0}
  build:
    context: .
    dockerfile: Dockerfile.backend
  restart: unless-stopped
  environment:
    FLASK_APP: run.py
    FLASK_DB_TYPE: postgres
    FLASK_DB_HOST: db
    FLASK_DB_PORT: "5432"
    FLASK_DB_USER: ${POSTGRES_USER:-postgres}
    FLASK_DB_PASSWORD: ${POSTGRES_PASSWORD:-secretpass}
    FLASK_DB_NAME: ${POSTGRES_DB:-postgres}
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend-net

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net

  backend1:
    <<: *backend

  backend2:
    <<: *backend

  frontend:
    image: guess-game-frontend:${FRONTEND_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend1
      - backend2
    networks:
      - frontend-net
      - backend-net

volumes:
  pgdata:

networks:
  frontend-net:
  backend-net:
