# Pool de instâncias do backend Flask.
# Estratégia: round-robin (padrão do NGINX). Se uma instância falhar
# (max_fails), ela sai do pool por fail_timeout e as requisições
# seguem para as demais.
upstream backend {
    server backend1:5000 max_fails=3 fail_timeout=10s;
    server backend2:5000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Frontend React (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API: /api/create -> backend:/create, /api/guess/<id> -> backend:/guess/<id>
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Em caso de erro/timeout, tenta a próxima instância do backend
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
    }
}
